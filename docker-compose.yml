version: '3.8'

services:
  backend:
    build: ./backend
    container_name: dormitory-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/dormitory_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
    networks:
      - dormitory-net

  frontend:
    build: ./frontend
    container_name: dormitory-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - dormitory-net

  db:
    image: mysql:8.0
    container_name: dormitory-db
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=dormitory_db
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - dormitory-net

volumes:
  db_data:

networks:
  dormitory-net:
    driver: bridge
